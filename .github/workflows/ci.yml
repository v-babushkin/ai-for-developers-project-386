name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  api-spec:
    name: API Spec
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-spec
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run build

  frontend:
    name: Frontend
    needs: api-spec
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run lint
      - run: npm run build

  backend:
    name: Backend
    needs: api-spec
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: 17
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - run: gradle test

  release-please:
    needs: [api-spec, frontend, backend]
    if: github.event_name == 'push' && github.actor != 'release-please[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Wait for hexlet-check
        uses: actions/github-script@v7
        with:
          script: |
            const runName = 'hexlet-check';
            const maxAttempts = 30;
            const pollInterval = 10_000;

            for (let i = 0; i < maxAttempts; i++) {
              const { data } = await github.rest.checks.listForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: context.sha,
              });

              const run = data.check_runs.find(r => r.name === runName);
              if (run) {
                if (run.status === 'completed') {
                  if (run.conclusion === 'success') {
                    console.log('hexlet-check passed');
                    return;
                  }
                  core.setFailed(`hexlet-check failed: ${run.conclusion}`);
                  return;
                }
                console.log(`hexlet-check status: ${run.status}, waiting...`);
              } else {
                console.log('hexlet-check not yet created, waiting...');
              }

              await new Promise(r => setTimeout(r, pollInterval));
            }

            core.setFailed('hexlet-check did not complete in time');

      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
